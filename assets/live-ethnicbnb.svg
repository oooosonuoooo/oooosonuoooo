<svg xmlns="http://www.w3.org/2000/svg" width="392" height="166" viewBox="0 0 392 166" role="img" aria-labelledby="title desc">
  <title id="title">EthnicBNB</title>
  <desc id="desc">Book heritage stays with local hosts.</desc>
  <style>
    svg {
      --ink: #17283b; --muted: #3d5367; --edge: #c6d1dc;
      --accent: #965136; --art: #f4e6dc; --tone: #df9b76; --pane: #fdfaf7;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink: #edf5fb; --muted: #aec0d0; --edge: #395263;
        --accent: #f9b99b; --art: #322329; --tone: #b87355; --pane: #151b25;
      }
    }
    .preview { transform-box: fill-box; transform-origin: center; }
    .speed-lines { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .preview { animation: frame-tilt 4.4s cubic-bezier(.22,.61,.36,1) infinite; }
      .speed-lines { animation: speed-lines 4.4s ease-out infinite; }
      .scenery { animation: scenery-drift 4.4s ease-in-out infinite; }
    }
    @keyframes frame-tilt {
      0%, 100% { transform: none; }
      24% { transform: translate(-3px,-4px) rotateX(12deg) rotateY(-20deg) skewY(-3deg); }
      55% { transform: translate(1px,1px) rotateX(-5deg) rotateY(11deg) skewY(1.5deg); }
      78% { transform: none; }
    }
    @keyframes speed-lines {
      0%, 14% { transform: translate(-24px,12px); opacity: 0; }
      31% { opacity: .68; }
      57%, 100% { transform: translate(39px,-17px); opacity: 0; }
    }
    @keyframes scenery-drift {
      0%, 100% { transform: none; }
      28% { transform: translate(-3px,2px); }
      62% { transform: translate(2px,-1px); }
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
  </style>
  <defs>
    <clipPath id="preview-bounds"><rect width="124" height="112" rx="10"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="391" height="165" rx="15" fill="var(--pane)" stroke="var(--edge)"/>
  <path d="M20 1h36" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(251 27)" aria-hidden="true">
    <rect x="2" y="3" width="122" height="112" rx="10" fill="var(--accent)" opacity=".16"/>
    <g class="preview" clip-path="url(#preview-bounds)">
      <rect width="124" height="112" rx="10" fill="var(--art)"/>
      <path d="M0 19h124" stroke="var(--accent)" opacity=".24"/>
      <path d="M12 10h1m5 0h1m5 0h1" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      <circle class="scenery" cx="87" cy="31" r="9" fill="var(--tone)" opacity=".72"/>
      <path d="M10 91 45 51l24 20 24-16 21 21v22H10Z" fill="var(--tone)" opacity=".4"/>
      <path d="M29 94V67l33-27 33 27v27H29Z" fill="var(--pane)" stroke="var(--accent)" stroke-width="1.5"/>
      <path d="M22 70 62 37l40 33M44 93V72h10v21m15 0V71h12v22" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M62 56v7m-3-3h6" stroke="var(--accent)" stroke-linecap="round"/>
      <path d="M17 95h90" stroke="var(--accent)" opacity=".55" stroke-linecap="round"/>
      <path class="speed-lines" d="M-18 55 39 31m-55 36 36-15m35 2 27-11M72 79l51-22m-29 31 36-15"
        fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(20)">
    <text class="mono" y="34" fill="var(--accent)" font-size="11.5" font-weight="700" letter-spacing=".6">01 / TRAVEL / BOOKING</text>
    <text y="66" fill="var(--ink)" font-size="27" font-weight="750">EthnicBNB</text>
    <text y="91" fill="var(--muted)" font-size="15">Book heritage stays<tspan x="0" dy="19">with local hosts.</tspan></text>
    <text y="144" fill="var(--accent)" font-size="13" font-weight="700">Visit live site <tspan dx="2">↗</tspan></text>
  </g>
</svg>
