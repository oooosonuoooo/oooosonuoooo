<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 372 232" width="372" height="232" role="img" aria-labelledby="title desc">
  <title id="title">EthnicBNB live project card</title>
  <desc id="desc">EthnicBNB is a live heritage-stay booking platform.</desc>
  <defs>
    <linearGradient id="ethnic-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a6ff"/><stop offset="0.52" stop-color="#1f6feb"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
    <linearGradient id="ethnic-glow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#58a6ff" stop-opacity=".28"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
    <pattern id="ethnic-grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#58a6ff" stroke-width=".5" opacity=".12"/></pattern>
    <filter id="ethnic-blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="ethnic-card"><rect x="1" y="1" width="358" height="218" rx="18"/></clipPath>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.tag{fill:#161b22;stroke:#30363d}.signal{animation:ethnic-signal 3.8s ease-in-out infinite}.orbit{animation:ethnic-orbit 8s linear infinite;transform-origin:453px 117px}
      @keyframes ethnic-signal{50%{opacity:.38;transform:scale(.82)}}@keyframes ethnic-orbit{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.signal,.orbit{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="358" height="218" rx="18" fill="#0d1117" stroke="url(#ethnic-edge)" stroke-width="2"/>
  <g clip-path="url(#ethnic-card)" aria-hidden="true"><rect x="1" y="1" width="358" height="218" fill="url(#ethnic-grid)"/><path d="M274 1H359V159Z" fill="#9cc9ff" opacity=".035"/><ellipse cx="291" cy="104" rx="92" ry="84" fill="url(#ethnic-glow)"/></g>
  <g class="ui">
    <text x="20" y="30" class="mono" fill="#9cc9ff" font-size="13" font-weight="700" letter-spacing=".35">01 / LIVE PROJECT</text>
    <path d="M20 42H340" stroke="#30363d"/>
    <text x="20" y="77" fill="#f0f6fc" font-size="26" font-weight="800">EthnicBNB</text>
    <text x="20" y="126" fill="#58a6ff" font-size="19" font-weight="500">Heritage stays</text>
    <text x="20" y="150" fill="#c9d1d9" font-size="19" font-weight="500">booking platform</text>
    <g transform="translate(20 178)" class="mono" font-size="13" font-weight="600" text-anchor="middle">
      <rect class="tag" x="0" width="91" height="28" rx="7"/><text x="45.5" y="19" fill="#9cc9ff">Web product</text>
      <rect class="tag" x="99" width="86" height="28" rx="7"/><text x="142" y="19" fill="#7ee787">Live site</text>
    </g>
  </g>
  <g transform="translate(76 35) scale(.49)" aria-hidden="true">
    <circle class="orbit" cx="453" cy="117" r="77" fill="none" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="4 11" opacity=".7"/>
    <path d="M393 112L453 58L513 112V177H393Z" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
    <path d="M414 177V121Q453 83 492 121V177" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <path d="M433 177V145Q453 125 473 145V177" fill="#161b22" stroke="#9cc9ff" stroke-width="1.6"/>
    <path d="M386 113L453 52L520 113" fill="none" stroke="#7ee787" stroke-width="3" stroke-linecap="round" filter="url(#ethnic-blur)"/>
    <circle class="signal" cx="453" cy="52" r="5" fill="#56d364" filter="url(#ethnic-blur)"/>
    <path d="M421 103H485M408 185H498" stroke="#30363d" stroke-width="2"/>
  </g>
</svg>
