<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-labelledby="title desc">
  <title id="title">Open work gallery</title>
  <desc id="desc">A neon button with a vector gallery mark labeled Work Gallery.</desc>
  <defs>
    <linearGradient id="gallery-edge" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#3fb950"/><stop offset="0.52" stop-color="#56d364"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <filter id="gallery-glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="2.5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="gallery-clip"><rect x="1" y="1" width="258" height="62" rx="13"/></clipPath>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.edge{animation:gallery-dash 5.2s linear infinite}.scan{animation:gallery-scan 2.8s ease-in-out infinite}
      @keyframes gallery-dash{to{stroke-dashoffset:-48}}@keyframes gallery-scan{50%{transform:translateY(5px);opacity:.42}}
      @media (prefers-reduced-motion:reduce){.edge,.scan{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="258" height="62" rx="13" fill="#0d1117" stroke="#161b22" stroke-width="2"/>
  <g clip-path="url(#gallery-clip)">
    <path d="M-4 60L56 0H84L20 64ZM198 64L260 2V31L227 64Z" fill="#3fb950" opacity="0.08"/>
    <path d="M93 0L141 64M188 0L252 64" stroke="#58a6ff" stroke-width="1" opacity="0.12"/>
  </g>
  <rect class="edge" x="2" y="2" width="256" height="60" rx="12" fill="none" stroke="url(#gallery-edge)" stroke-width="1.5" stroke-dasharray="72 188"/>
  <g transform="translate(17 12)">
    <rect x="2" y="4" width="36" height="32" rx="5" fill="#161b22" stroke="#56d364" stroke-width="1.7"/>
    <circle cx="29" cy="13" r="4" fill="#58a6ff"/>
    <path d="M7 30L16 21L22 27L27 22L35 30" fill="none" stroke="#f0f6fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="scan" d="M0 8V1H7M40 32V39H33" fill="none" stroke="#3fb950" stroke-width="1.5" filter="url(#gallery-glow)"/>
  </g>
  <g class="ui">
    <text x="72" y="29" fill="#f0f6fc" font-size="15" font-weight="800" letter-spacing="1.3">WORK GALLERY</text>
    <text x="72" y="45" class="mono" fill="#56d364" font-size="9" font-weight="700" letter-spacing="2.4">VIEW BUILDS</text>
    <path d="M220 25L228 32L220 39M207 32H228" fill="none" stroke="#f0f6fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
