<svg xmlns="http://www.w3.org/2000/svg" width="360" height="150" viewBox="0 0 360 150" role="img" aria-labelledby="title desc">
  <title id="title">Puremilk</title>
  <desc id="desc">Browse farm-fresh dairy for delivery in Kolkata.</desc>
  <style>
    svg {
      --ink: #17283b; --muted: #3d5367; --edge: #c6d1dc;
      --accent: #176951; --art: #e4f0e8; --tone: #78b89b; --pane: #f6fbf8;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink: #edf5fb; --muted: #aec0d0; --edge: #395263;
        --accent: #8de7ba; --art: #172e2c; --tone: #40896c; --pane: #131e23;
      }
    }
    .preview { transform-box: fill-box; transform-origin: center; }
    .speed-lines { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .preview { animation: frame-tilt 4.4s cubic-bezier(.22,.61,.36,1); }
      .speed-lines { animation: speed-lines 4.4s ease-out; }
      .scenery { animation: scenery-drift 4.4s ease-in-out; }
    }
    @keyframes frame-tilt {
      0%, 100% { transform: none; }
      24% { transform: translate(-3px,-4px) rotateX(12deg) rotateY(-20deg) skewY(-3deg); }
      55% { transform: translate(1px,1px) rotateX(-5deg) rotateY(11deg) skewY(1.5deg); }
      78% { transform: none; }
    }
    @keyframes speed-lines {
      0%, 14% { transform: translate(-24px,12px); opacity: 0; }
      31% { opacity: .68; }
      57%, 100% { transform: translate(39px,-17px); opacity: 0; }
    }
    @keyframes scenery-drift {
      0%, 100% { transform: none; }
      28% { transform: translate(-3px,2px); }
      62% { transform: translate(2px,-1px); }
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
  </style>
  <defs>
    <clipPath id="preview-bounds"><rect width="124" height="112" rx="10"/></clipPath>
  </defs>
  <rect x=".5" y=".5" width="359" height="149" rx="15" fill="var(--pane)" stroke="var(--edge)"/>
  <path d="M16 1h36" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(233 19)" aria-hidden="true">
    <rect x="2" y="3" width="122" height="112" rx="10" fill="var(--accent)" opacity=".16"/>
    <g class="preview" clip-path="url(#preview-bounds)">
      <rect width="124" height="112" rx="10" fill="var(--art)"/>
      <path d="M0 19h124" stroke="var(--accent)" opacity=".24"/>
      <path d="M12 10h1m5 0h1m5 0h1" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      <circle class="scenery" cx="88" cy="36" r="13" fill="var(--tone)" opacity=".68"/>
      <path d="M10 94c18-15 33-17 56-8 16-11 31-14 48-4v16H10Z" fill="var(--tone)" opacity=".5"/>
      <path d="M42 44h19v11c0 7 7 10 7 17v16a5 5 0 0 1-5 5H40a5 5 0 0 1-5-5V72c0-7 7-10 7-17Z" fill="var(--pane)" stroke="var(--accent)" stroke-width="1.7"/>
      <rect x="40" y="40" width="23" height="7" rx="2" fill="var(--accent)"/>
      <path d="M40 73h23v12H40Z" fill="var(--art)"/>
      <path d="M51.5 74.5c-2 3.2-3.4 4.6-3.4 6a3.4 3.4 0 1 0 6.8 0c0-1.4-1.4-2.8-3.4-6Z" fill="var(--accent)"/>
      <path d="M77 77h21l-3 15H80Z" fill="var(--pane)" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M17 95h90" stroke="var(--accent)" opacity=".55" stroke-linecap="round"/>
      <path class="speed-lines" d="M-18 55 39 31m-55 36 36-15m35 2 27-11M72 79l51-22m-29 31 36-15"
        fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(16)">
    <text class="mono" y="29" fill="var(--accent)" font-size="11.5" font-weight="700" letter-spacing=".6">02 / FOOD / STOREFRONT</text>
    <text y="59" fill="var(--ink)" font-size="27" font-weight="750">Puremilk</text>
    <text y="82" fill="var(--muted)" font-size="15">Browse farm-fresh dairy<tspan x="0" dy="19">for delivery in Kolkata.</tspan></text>
    <text y="132" fill="var(--accent)" font-size="13" font-weight="700">Visit live site <tspan dx="2">↗</tspan></text>
  </g>
</svg>
