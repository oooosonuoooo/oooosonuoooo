<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 368 152" width="368" height="152" role="img" aria-labelledby="title desc">
  <title id="title">Puremilk live project card</title>
  <desc id="desc">Puremilk is a live farm-fresh dairy delivery storefront.</desc>
  <defs>
    <linearGradient id="milk-edge" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1f6feb"/><stop offset=".48" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <linearGradient id="milk-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0f6fc" stop-opacity=".18"/><stop offset="1" stop-color="#58a6ff" stop-opacity=".04"/></linearGradient>
    <pattern id="milk-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1f6feb" stroke-width=".55" opacity=".12"/></pattern>
    <filter id="milk-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="milk-card"><rect x="1" y="1" width="358" height="142" rx="14"/></clipPath>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.tag{fill:#161b22;stroke:#30363d}.drop{animation:milk-drop 3.2s ease-in-out infinite}.leaf{animation:milk-leaf 4.6s ease-in-out infinite;transform-origin:453px 110px}
      @keyframes milk-drop{50%{transform:translateY(5px);opacity:.62}}@keyframes milk-leaf{50%{transform:rotate(-5deg)}}
      @media (prefers-reduced-motion:reduce){.drop,.leaf{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="358" height="142" rx="14" fill="#0d1117" stroke="url(#milk-edge)" stroke-width="2"/>
  <g clip-path="url(#milk-card)" aria-hidden="true">
    <rect x="1" y="1" width="358" height="142" fill="url(#milk-grid)"/>
    <path d="M278 1H359V143Z" fill="#7ee787" opacity=".035"/>
  </g>
  <g class="ui">
    <text x="16" y="36" fill="#f0f6fc" font-size="24" font-weight="800">Puremilk</text>
    <text x="16" y="62" fill="#7ee787" font-size="18" font-weight="500">Farm-fresh dairy</text>
    <text x="16" y="83" fill="#c9d1d9" font-size="18" font-weight="500">delivery storefront</text>
    <g transform="translate(16 102)" class="mono" font-size="13" font-weight="600" text-anchor="middle">
      <rect x="0" width="96" height="26" rx="6" fill="#161b22" stroke="#30363d"/><text x="48" y="18" fill="#9cc9ff">Brand web</text>
      <rect x="103" width="91" height="26" rx="6" fill="#161b22" stroke="#30363d"/><text x="148.5" y="18" fill="#7ee787">Live site</text>
    </g>
  </g>

  <g transform="translate(94 14) scale(.46)" aria-hidden="true">
    <path d="M427 55H479L491 78V173Q491 185 479 185H427Q415 185 415 173V78Z" fill="url(#milk-fill)" stroke="#f0f6fc" stroke-width="2.2"/>
    <path d="M427 55H479V79H427Z" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <path d="M415 95H491" stroke="#3fb950" stroke-width="3"/>
    <path class="drop" d="M453 111C444 123 439 129 439 137C439 145 445 151 453 151C461 151 467 145 467 137C467 129 462 123 453 111Z" fill="#58a6ff" filter="url(#milk-glow)"/>
    <g class="leaf" fill="none" stroke="#7ee787" stroke-width="3" stroke-linecap="round"><path d="M453 104Q465 84 486 88Q478 108 453 110"/><path d="M453 109Q441 91 423 93Q431 111 453 112"/></g>
    <path d="M401 186H505" stroke="#30363d" stroke-width="2"/>
    <circle cx="453" cy="43" r="4" fill="#56d364" filter="url(#milk-glow)"/>
  </g>
</svg>
