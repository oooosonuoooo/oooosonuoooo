<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Tuhin Das — GitHub-style resume header</title>
  <desc id="desc">A black, white, blue, and green profile banner for Tuhin Das, a mechanical engineer focused on digital systems, quality assurance, and automation.</desc>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#30363d" stroke-width="1" opacity="0.46"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#58a6ff"/>
      <stop offset="0.72" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="url(#grid)" stroke="#30363d" stroke-width="2"/>

  <g opacity="0.9">
    <rect x="760" y="48" width="28" height="28" rx="5" fill="#161b22"/>
    <rect x="796" y="48" width="28" height="28" rx="5" fill="#0e4429"/>
    <rect x="832" y="48" width="28" height="28" rx="5" fill="#006d32"/>
    <rect x="868" y="48" width="28" height="28" rx="5" fill="#26a641"/>
    <rect x="904" y="48" width="28" height="28" rx="5" fill="#39d353"/>

    <rect x="760" y="84" width="28" height="28" rx="5" fill="#0e4429"/>
    <rect x="796" y="84" width="28" height="28" rx="5" fill="#161b22"/>
    <rect x="832" y="84" width="28" height="28" rx="5" fill="#26a641"/>
    <rect x="868" y="84" width="28" height="28" rx="5" fill="#0e4429"/>
    <rect x="904" y="84" width="28" height="28" rx="5" fill="#39d353"/>

    <rect x="760" y="120" width="28" height="28" rx="5" fill="#006d32"/>
    <rect x="796" y="120" width="28" height="28" rx="5" fill="#26a641"/>
    <rect x="832" y="120" width="28" height="28" rx="5" fill="#39d353"/>
    <rect x="868" y="120" width="28" height="28" rx="5" fill="#0e4429"/>
    <rect x="904" y="120" width="28" height="28" rx="5" fill="#161b22"/>

    <rect x="760" y="156" width="28" height="28" rx="5" fill="#161b22"/>
    <rect x="796" y="156" width="28" height="28" rx="5" fill="#0e4429"/>
    <rect x="832" y="156" width="28" height="28" rx="5" fill="#006d32"/>
    <rect x="868" y="156" width="28" height="28" rx="5" fill="#26a641"/>
    <rect x="904" y="156" width="28" height="28" rx="5" fill="#39d353"/>

    <rect x="760" y="192" width="28" height="28" rx="5" fill="#0e4429"/>
    <rect x="796" y="192" width="28" height="28" rx="5" fill="#006d32"/>
    <rect x="832" y="192" width="28" height="28" rx="5" fill="#161b22"/>
    <rect x="868" y="192" width="28" height="28" rx="5" fill="#39d353"/>
    <rect x="904" y="192" width="28" height="28" rx="5" fill="#26a641"/>
  </g>

  <g filter="url(#softGlow)" opacity="0.82">
    <circle cx="1010" cy="92" r="5" fill="#58a6ff"/>
    <circle cx="1050" cy="124" r="4" fill="#3fb950"/>
    <circle cx="1088" cy="76" r="3" fill="#58a6ff"/>
    <circle cx="1110" cy="180" r="5" fill="#3fb950"/>
  </g>

  <text x="78" y="72" fill="#58a6ff" font-family="'Liberation Mono', monospace" font-size="14" font-weight="700" letter-spacing="3">README // PROFESSIONAL PROFILE</text>
  <text x="76" y="158" fill="#f0f6fc" font-family="'DejaVu Sans', sans-serif" font-size="72" font-weight="800" letter-spacing="-2">TUHIN DAS</text>
  <text x="80" y="200" fill="#8b949e" font-family="'Liberation Mono', monospace" font-size="15" font-weight="700" letter-spacing="1.2">MECHANICAL ENGINEER  •  DIGITAL SYSTEMS  •  QA  •  AUTOMATION</text>

  <rect x="80" y="238" width="1040" height="2" fill="url(#line)"/>
  <circle cx="80" cy="239" r="5" fill="#58a6ff"/>
  <circle cx="1120" cy="239" r="5" fill="#3fb950"/>

  <text x="80" y="276" fill="#f0f6fc" font-family="'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1.8">@oooosonuoooo</text>
  <text x="1120" y="276" fill="#3fb950" font-family="'Liberation Mono', monospace" font-size="13" font-weight="700" text-anchor="end" letter-spacing="1.8">KOLKATA, INDIA  //  BUILD • TEST • AUTOMATE</text>
</svg>
