<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 150" width="570" height="150" role="img" aria-labelledby="title desc">
  <title id="title">Automation lab focus card</title>
  <desc id="desc">A visual focus card for Linux automation, agent tooling, Python, and system services.</desc>
  <defs>
    <linearGradient id="pm-edge" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#56d364"/><stop offset="0.5" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <linearGradient id="pm-drop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a6ff"/><stop offset="1" stop-color="#1f6feb"/></linearGradient>
    <pattern id="pm-grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#56d364" stroke-width="0.5" opacity="0.09"/></pattern>
    <filter id="pm-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="pm-clip"><rect x="1" y="1" width="568" height="148" rx="16"/></clipPath>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.flow{animation:pm-flow 4s linear infinite}.core{animation:pm-core 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes pm-flow{to{stroke-dashoffset:-42}}@keyframes pm-core{50%{transform:scale(1.1);opacity:.72}}
      @media (prefers-reduced-motion:reduce){.flow,.core{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="568" height="148" rx="16" fill="#0d1117" stroke="url(#pm-edge)" stroke-width="2"/>
  <g clip-path="url(#pm-clip)"><rect x="1" y="1" width="568" height="148" fill="url(#pm-grid)"/><path d="M304 -10L330 -10L270 160H244Z" fill="#3fb950" opacity="0.05"/></g>
  <g class="ui">
    <text x="22" y="27" class="mono" fill="#56d364" font-size="9" font-weight="700" letter-spacing="2">FOCUS // 02</text>
    <path d="M22 37H296" stroke="#8b949e" stroke-width="1" stroke-dasharray="2 6" opacity="0.28"/>
    <text x="22" y="70" fill="#f0f6fc" font-size="25" font-weight="900" letter-spacing="1.5">AUTOMATION LAB</text>
    <text x="22" y="94" class="mono" fill="#58a6ff" font-size="11" font-weight="800" letter-spacing="1.8">LINUX / AGENTS / TOOLING</text>
    <g class="mono" font-size="9" font-weight="700" text-anchor="middle"><rect x="22" y="109" width="82" height="24" rx="6" fill="#161b22" stroke="#3fb950" stroke-opacity="0.5"/><text x="63" y="125" fill="#3fb950">PYTHON</text><rect x="112" y="109" width="88" height="24" rx="6" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.5"/><text x="156" y="125" fill="#58a6ff">SYSTEMD</text></g>
  </g>
  <g>
    <circle cx="453" cy="75" r="53" fill="#161b22" stroke="#8b949e" stroke-opacity="0.28"/>
    <path class="flow" d="M372 75H407M499 75H541M453 15V32M453 118V135" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-dasharray="6 6"/>
    <rect x="414" y="42" width="78" height="66" rx="9" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <path d="M414 56H492" stroke="#58a6ff" stroke-width="2"/><circle cx="425" cy="49" r="2.5" fill="#3fb950"/><circle cx="434" cy="49" r="2.5" fill="#56d364"/>
    <path d="M428 70L438 79L428 88M446 88H474" fill="none" stroke="#f0f6fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="core" cx="478" cy="96" r="6" fill="#3fb950" filter="url(#pm-glow)"/>
    <g fill="#56d364"><circle cx="384" cy="75" r="3"/><circle cx="530" cy="75" r="3"/><circle cx="453" cy="27" r="3"/><circle cx="453" cy="123" r="3"/></g>
    <path d="M390 51L402 63M516 51L504 63M390 99L402 87M516 99L504 87" stroke="#58a6ff" stroke-width="1.5" opacity="0.62"/>
  </g>
</svg>
