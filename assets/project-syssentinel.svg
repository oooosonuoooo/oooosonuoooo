<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" role="img" aria-labelledby="title desc">
  <title id="title">SysSentinel project card</title>
  <desc id="desc">SysSentinel is a safe resource watchdog built with Python and Shell.</desc>
  <defs>
    <linearGradient id="ss-edge" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1f6feb"/><stop offset="0.48" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <radialGradient id="ss-radar"><stop stop-color="#58a6ff" stop-opacity="0.24"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
    <pattern id="ss-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1f6feb" stroke-width="0.55" opacity="0.12"/></pattern>
    <filter id="ss-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="ss-card"><rect x="1" y="1" width="358" height="218" rx="18"/></clipPath>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.tag{fill:#161b22;stroke:#30363d}.orbit{animation:ss-spin 9s linear infinite;transform-origin:453px 117px}.sweep{animation:ss-sweep 4.8s linear infinite;transform-origin:453px 117px}.eye{animation:ss-eye 2s ease-in-out infinite}.dash{animation:ss-dash 5s linear infinite}
      @keyframes ss-spin{to{transform:rotate(360deg)}}@keyframes ss-sweep{to{transform:rotate(360deg)}}@keyframes ss-eye{50%{opacity:.45}}@keyframes ss-dash{to{stroke-dashoffset:-48}}
      @media (prefers-reduced-motion:reduce){.orbit,.sweep,.eye,.dash{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="358" height="218" rx="18" fill="#0d1117" stroke="url(#ss-edge)" stroke-width="2"/>
  <g clip-path="url(#ss-card)" aria-hidden="true">
    <rect x="1" y="1" width="358" height="218" fill="url(#ss-grid)"/>
    <path d="M279 1H359V159Z" fill="#7ee787" opacity=".035"/>
  </g>
  <g class="ui">
    <text x="20" y="30" class="mono" fill="#7ee787" font-size="13" font-weight="700" letter-spacing=".35">02 / SYSTEM GUARD</text>
    <path d="M20 42H340" stroke="#30363d"/>
    <text x="20" y="77" fill="#f0f6fc" font-size="26" font-weight="800">SysSentinel</text>
    <text x="20" y="126" fill="#7ee787" font-size="19" font-weight="500">Safe resource</text>
    <text x="20" y="150" fill="#c9d1d9" font-size="19" font-weight="500">watchdog</text>
    <g transform="translate(20 178)" class="mono" font-size="13" font-weight="600" text-anchor="middle">
      <rect class="tag" x="0" width="78" height="28" rx="7"/><text x="39" y="19" fill="#9cc9ff">Python</text>
      <rect class="tag" x="86" width="69" height="28" rx="7"/><text x="120.5" y="19" fill="#7ee787">Shell</text>
    </g>
  </g>

  <g transform="translate(70 33) scale(.5)" aria-hidden="true">
    <circle cx="453" cy="117" r="78" fill="#161b22" stroke="#8b949e" stroke-opacity="0.22"/>
    <circle class="orbit" cx="453" cy="117" r="68" fill="none" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="4 10"/>
    <circle cx="453" cy="117" r="51" fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.55"/>
    <path class="sweep" d="M453 117L453 56A61 61 0 0 1 506 87Z" fill="#58a6ff" opacity="0.12"/>
    <path d="M453 61L499 79V118C499 150 481 172 453 184C425 172 407 150 407 118V79Z" fill="#0d1117" stroke="url(#ss-edge)" stroke-width="2.5"/>
    <path d="M453 75L486 88V117C486 140 474 155 453 166C432 155 420 140 420 117V88Z" fill="#161b22" stroke="#1f6feb" stroke-width="1"/>
    <path class="eye" d="M430 114Q453 94 476 114Q453 135 430 114Z" fill="#58a6ff" filter="url(#ss-glow)"/>
    <path d="M441 114Q453 104 465 114Q453 124 441 114Z" fill="#0d1117"/>
    <circle cx="453" cy="114" r="4" fill="#56d364"/>
    <path d="M425 145L437 151M481 145L469 151M453 70V57M403 117H391M515 117H503" stroke="#58a6ff" stroke-width="1.5"/>
    <g fill="#56d364"><circle cx="397" cy="88" r="2"/><circle cx="509" cy="147" r="2"/><circle cx="493" cy="68" r="2"/></g>
  </g>
</svg>
