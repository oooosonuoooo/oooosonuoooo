<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 230" width="570" height="230" role="img" aria-labelledby="title desc">
  <title id="title">SysSentinel project card</title>
  <desc id="desc">SysSentinel is a safe resource watchdog built with Python and Shell.</desc>
  <defs>
    <linearGradient id="ss-edge" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#1f6feb"/><stop offset="0.48" stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <radialGradient id="ss-radar"><stop stop-color="#58a6ff" stop-opacity="0.24"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
    <pattern id="ss-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1f6feb" stroke-width="0.55" opacity="0.12"/></pattern>
    <filter id="ss-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="ss-card"><rect x="1" y="1" width="568" height="228" rx="18"/></clipPath>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.tag{fill:#161b22;stroke:#8b949e;stroke-opacity:.38}.orbit{animation:ss-spin 9s linear infinite;transform-origin:453px 117px}.sweep{animation:ss-sweep 4.8s linear infinite;transform-origin:453px 117px}.eye{animation:ss-eye 2s ease-in-out infinite}.dash{animation:ss-dash 5s linear infinite}
      @keyframes ss-spin{to{transform:rotate(360deg)}}@keyframes ss-sweep{to{transform:rotate(360deg)}}@keyframes ss-eye{50%{opacity:.45}}@keyframes ss-dash{to{stroke-dashoffset:-48}}
      @media (prefers-reduced-motion:reduce){.orbit,.sweep,.eye,.dash{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="568" height="228" rx="18" fill="#0d1117" stroke="url(#ss-edge)" stroke-width="2"/>
  <g clip-path="url(#ss-card)">
    <rect x="1" y="1" width="568" height="228" fill="url(#ss-grid)"/>
    <circle cx="453" cy="117" r="145" fill="url(#ss-radar)"/>
    <path d="M-10 218L168 40H282L470 228" fill="none" stroke="#3fb950" stroke-width="1" opacity="0.1"/>
  </g>

  <g class="ui">
    <text x="24" y="29" class="mono" fill="#3fb950" font-size="10" font-weight="700" letter-spacing="2.1">02 // SYSTEM GUARD</text>
    <circle cx="315" cy="25" r="3" fill="#58a6ff" filter="url(#ss-glow)"/>
    <path d="M24 40H326" stroke="#8b949e" stroke-width="1" stroke-dasharray="2 7" opacity="0.3"/>
    <text x="24" y="76" fill="#f0f6fc" font-size="27" font-weight="900" letter-spacing="1.4">SYSSENTINEL</text>
    <text x="24" y="107" class="mono" fill="#58a6ff" font-size="13" font-weight="800" letter-spacing="2.2">SAFE RESOURCE</text>
    <text x="24" y="128" class="mono" fill="#8b949e" font-size="13" font-weight="700" letter-spacing="1.9">WATCHDOG</text>
    <g transform="translate(24 158)">
      <rect class="tag" width="82" height="27" rx="7"/><text x="41" y="18" class="mono" fill="#58a6ff" font-size="10" font-weight="700" text-anchor="middle">PYTHON</text>
      <rect class="tag" x="90" width="72" height="27" rx="7"/><text x="126" y="18" class="mono" fill="#3fb950" font-size="10" font-weight="700" text-anchor="middle">SHELL</text>
    </g>
    <path class="dash" d="M24 207H285L295 197H326" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="16 6"/>
    <text x="24" y="215" class="mono" fill="#8b949e" font-size="8" letter-spacing="1.5">WATCH // LIMIT // RECOVER</text>
  </g>

  <g>
    <circle cx="453" cy="117" r="78" fill="#161b22" stroke="#8b949e" stroke-opacity="0.22"/>
    <circle class="orbit" cx="453" cy="117" r="68" fill="none" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="4 10"/>
    <circle cx="453" cy="117" r="51" fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.55"/>
    <path class="sweep" d="M453 117L453 56A61 61 0 0 1 506 87Z" fill="#58a6ff" opacity="0.12"/>
    <path d="M453 61L499 79V118C499 150 481 172 453 184C425 172 407 150 407 118V79Z" fill="#0d1117" stroke="url(#ss-edge)" stroke-width="2.5"/>
    <path d="M453 75L486 88V117C486 140 474 155 453 166C432 155 420 140 420 117V88Z" fill="#161b22" stroke="#1f6feb" stroke-width="1"/>
    <path class="eye" d="M430 114Q453 94 476 114Q453 135 430 114Z" fill="#58a6ff" filter="url(#ss-glow)"/>
    <path d="M441 114Q453 104 465 114Q453 124 441 114Z" fill="#0d1117"/>
    <circle cx="453" cy="114" r="4" fill="#56d364"/>
    <path d="M425 145L437 151M481 145L469 151M453 70V57M403 117H391M515 117H503" stroke="#58a6ff" stroke-width="1.5"/>
    <g fill="#56d364"><circle cx="397" cy="88" r="2"/><circle cx="509" cy="147" r="2"/><circle cx="493" cy="68" r="2"/></g>
  </g>
</svg>
