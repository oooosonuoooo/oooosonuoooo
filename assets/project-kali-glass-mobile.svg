<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 368 152" width="368" height="152" role="img" aria-labelledby="title desc">
  <title id="title">Kali Glass project card</title>
  <desc id="desc">Kali Glass is an X11 display control project built with Python, PyQt5, and xrandr.</desc>
  <defs>
    <linearGradient id="kg-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a6ff"/><stop offset="0.5" stop-color="#f0f6fc"/><stop offset="1" stop-color="#1f6feb"/></linearGradient>
    <linearGradient id="kg-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a6ff" stop-opacity="0.28"/><stop offset="0.5" stop-color="#1f6feb" stop-opacity="0.15"/><stop offset="1" stop-color="#3fb950" stop-opacity="0.3"/></linearGradient>
    <pattern id="kg-grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#58a6ff" stroke-width="0.5" opacity="0.11"/></pattern>
    <filter id="kg-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="kg-card"><rect x="1" y="1" width="358" height="142" rx="14"/></clipPath>
    <style>
      .ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.tag{fill:#161b22;stroke:#30363d}.pane-a{animation:kg-float-a 5s ease-in-out infinite}.pane-b{animation:kg-float-b 6s ease-in-out infinite}.cursor{animation:kg-cursor 1.4s steps(1,end) infinite}.trace{animation:kg-trace 5s linear infinite}
      @keyframes kg-float-a{50%{transform:translate(-4px,5px)}}@keyframes kg-float-b{50%{transform:translate(5px,-4px)}}@keyframes kg-cursor{50%{opacity:.15}}@keyframes kg-trace{to{stroke-dashoffset:-44}}
      @media (prefers-reduced-motion:reduce){.pane-a,.pane-b,.cursor,.trace{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="358" height="142" rx="14" fill="#0d1117" stroke="url(#kg-edge)" stroke-width="2"/>
  <g clip-path="url(#kg-card)" aria-hidden="true">
    <rect x="1" y="1" width="358" height="142" fill="url(#kg-grid)"/>
    <path d="M278 1H359V143Z" fill="#9cc9ff" opacity=".035"/>
  </g>
  <g class="ui">
    <text x="16" y="36" fill="#f0f6fc" font-size="24" font-weight="800">Kali Glass</text>
    <text x="16" y="72" fill="#9cc9ff" font-size="18" font-weight="500">X11 display control</text>
    <g transform="translate(16 102)" class="mono" font-size="13" font-weight="600" text-anchor="middle">
      <rect x="0" width="72" height="26" rx="6" fill="#161b22" stroke="#30363d"/><text x="36" y="18" fill="#9cc9ff">Python</text>
      <rect x="79" width="66" height="26" rx="6" fill="#161b22" stroke="#30363d"/><text x="112" y="18" fill="#7ee787">PyQt5</text>
      <rect x="152" width="72" height="26" rx="6" fill="#161b22" stroke="#30363d"/><text x="188" y="18" fill="#9cc9ff">xrandr</text>
    </g>
  </g>

  <g transform="translate(139 25) scale(.36)" aria-hidden="true">
    <path d="M373 55L395 33H531L547 49V164L525 186H389L373 170Z" fill="url(#kg-glass)" stroke="#58a6ff" stroke-width="1.6"/>
    <path d="M382 64L402 44H523L538 57V156L518 176H397L382 163Z" fill="#161b22" fill-opacity="0.72" stroke="#f0f6fc" stroke-opacity="0.32"/>
    <g class="pane-a">
      <rect x="401" y="59" width="105" height="67" rx="5" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
      <path d="M401 72H506" stroke="#1f6feb"/><circle cx="410" cy="66" r="2" fill="#3fb950"/><circle cx="417" cy="66" r="2" fill="#56d364"/>
      <path d="M414 88H468M414 98H488M414 108H452" stroke="#58a6ff" stroke-width="2" opacity="0.72"/>
      <rect class="cursor" x="457" y="104" width="7" height="5" fill="#f0f6fc"/>
    </g>
    <g class="pane-b">
      <rect x="430" y="104" width="94" height="56" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
      <path d="M430 116H524" stroke="#3fb950"/><circle cx="439" cy="110" r="2" fill="#58a6ff"/>
      <path d="M443 132L452 141L470 123" fill="none" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M481 130H512M481 140H504" stroke="#8b949e" stroke-width="2"/>
    </g>
    <path d="M389 186L381 199H538L525 186" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
    <path d="M370 91H355V140H370M547 77H558V122H547" fill="none" stroke="#3fb950" stroke-width="2" filter="url(#kg-glow)"/>
    <circle cx="558" cy="134" r="3" fill="#56d364"/>
  </g>
</svg>
