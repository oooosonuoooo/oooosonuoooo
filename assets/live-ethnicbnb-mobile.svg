<svg xmlns="http://www.w3.org/2000/svg" width="360" height="150" viewBox="0 0 360 150" role="img" aria-labelledby="title desc">
  <title id="title">EthnicBNB</title>
  <desc id="desc">Book heritage stays with local hosts.</desc>
  <style>
    svg {
      --ink: #17283b; --muted: #3d5367; --edge: #c6d1dc;
      --accent: #965136; --art: #f4e6dc; --tone: #df9b76; --pane: #fdfaf7;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink: #edf5fb; --muted: #aec0d0; --edge: #395263;
        --accent: #f9b99b; --art: #322329; --tone: #b87355; --pane: #151b25;
      }
    }
    @media (prefers-reduced-motion: no-preference) {
      .accent-light { animation: accent-light 2.8s ease-in-out; }
    }
    @keyframes accent-light { 50% { opacity: .95; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
  </style>
  <rect x=".5" y=".5" width="359" height="149" rx="15" fill="var(--pane)" stroke="var(--edge)"/>
  <path d="M16 1h36" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(233 19)" aria-hidden="true">
    <rect width="124" height="112" rx="10" fill="var(--art)"/>
    <path d="M0 19h124" stroke="var(--accent)" opacity=".24"/>
    <path d="M12 10h1m5 0h1m5 0h1" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
    <circle class="accent-light" cx="87" cy="31" r="9" fill="var(--tone)" opacity=".72"/>
    <path d="M10 91 45 51l24 20 24-16 21 21v22H10Z" fill="var(--tone)" opacity=".4"/>
    <path d="M29 94V67l33-27 33 27v27H29Z" fill="var(--pane)" stroke="var(--accent)" stroke-width="1.5"/>
    <path d="M22 70 62 37l40 33M44 93V72h10v21m15 0V71h12v22" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 56v7m-3-3h6" stroke="var(--accent)" stroke-linecap="round"/>
    <path d="M17 95h90" stroke="var(--accent)" opacity=".55" stroke-linecap="round"/>
  </g>
  <g transform="translate(16)">
    <text class="mono" y="29" fill="var(--accent)" font-size="11.5" font-weight="700" letter-spacing=".6">01 / TRAVEL / BOOKING</text>
    <text y="59" fill="var(--ink)" font-size="27" font-weight="750">EthnicBNB</text>
    <text y="82" fill="var(--muted)" font-size="15">Book heritage stays<tspan x="0" dy="19">with local hosts.</tspan></text>
    <text y="132" fill="var(--accent)" font-size="13" font-weight="700">Visit live site <tspan dx="2">↗</tspan></text>
  </g>
</svg>
