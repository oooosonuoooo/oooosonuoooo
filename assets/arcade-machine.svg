<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neon-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes blinkText {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.15; }
      }
      @keyframes floatScore {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      @keyframes pacmanMouth {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(25deg); }
      }
      .coin-blink {
        animation: blinkText 1.2s infinite;
      }
      .score-float {
        animation: floatScore 3s ease-in-out infinite;
      }
      .font-mono {
        font-family: 'Courier New', Courier, monospace, 'JetBrains Mono';
        font-weight: bold;
      }
    </style>
  </defs>

  <!-- Dark Arcade HUD Chassis -->
  <rect x="10" y="10" width="780" height="180" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" />
  <rect x="20" y="20" width="760" height="160" rx="10" fill="url(#screen-glow)" stroke="url(#neon-cyan)" stroke-width="1.5" />

  <!-- CRT Scanline Grid Effect -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <line x1="20" y1="45" x2="780" y2="45" />
    <line x1="20" y1="70" x2="780" y2="70" />
    <line x1="20" y1="95" x2="780" y2="95" />
    <line x1="20" y1="120" x2="780" y2="120" />
    <line x1="20" y1="145" x2="780" y2="145" />
    <line x1="20" y1="170" x2="780" y2="170" />
  </g>

  <!-- Arcade Header -->
  <g class="score-float">
    <text x="50" y="55" fill="#f72585" class="font-mono" font-size="16" letter-spacing="3" filter="url(#glow)">★ RETRO ARCADE ZONE ★</text>
    <text x="50" y="80" fill="#ffffff" class="font-mono" font-size="20" font-weight="900" letter-spacing="2">CONTRIBUTION GAMING STATION</text>
  </g>

  <!-- Arcade Pacman & Ghost Graphic -->
  <g transform="translate(50, 115)">
    <!-- Pacman -->
    <circle cx="20" cy="20" r="16" fill="#ffd60a" />
    <polygon points="20,20 38,10 38,30" fill="#090d16" />
    <!-- Dots -->
    <circle cx="55" cy="20" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="85" cy="20" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="115" cy="20" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="145" cy="20" r="4" fill="#ffffff" opacity="0.8" />
    <!-- Blinky Ghost -->
    <g transform="translate(175, 4)">
      <path d="M 4 16 C 4 7 11 0 20 0 C 29 0 36 7 36 16 L 36 32 L 30 27 L 24 32 L 16 27 L 10 32 L 4 27 Z" fill="#f72585" filter="url(#glow)" />
      <circle cx="14" cy="14" r="4" fill="#ffffff" />
      <circle cx="15" cy="14" r="2" fill="#03045e" />
      <circle cx="26" cy="14" r="4" fill="#ffffff" />
      <circle cx="27" cy="14" r="2" fill="#03045e" />
    </g>
  </g>

  <!-- Right Side Telemetry / High Scores -->
  <g transform="translate(530, 45)">
    <rect x="0" y="0" width="220" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="15" y="25" fill="#58a6ff" class="font-mono" font-size="12" letter-spacing="1">ARCADE METRICS</text>
    <text x="15" y="48" fill="#00f2fe" class="font-mono" font-size="13">GAMES : PACMAN • SNAKE</text>
    <text x="15" y="68" fill="#00f2fe" class="font-mono" font-size="13">MODE  : BREAKOUT • CRT</text>
    <text x="15" y="94" fill="#39d353" class="font-mono coin-blink" font-size="13" font-weight="bold">PRESS [START] TO PLAY</text>
  </g>
</svg>
