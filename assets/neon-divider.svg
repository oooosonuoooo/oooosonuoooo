<svg xmlns="http://www.w3.org/2000/svg" width="880" height="16" viewBox="0 0 880 16">
  <style>
    svg { --line: #b8cbd2; --blue: #126c8d; --green: #157652; }
    @media (prefers-color-scheme: dark) {
      svg { --line: #385261; --blue: #62d3ff; --green: #77e7ad; }
    }
    .sweep { animation: sweep 3.8s ease-out; opacity: 0; }
    @keyframes sweep {
      from { transform: translateX(-140px); opacity: 0; }
      18% { opacity: .82; }
      82% { opacity: .82; }
      to { transform: translateX(880px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .sweep { animation: none; } }
  </style>
  <defs>
    <linearGradient id="beam">
      <stop stop-color="var(--blue)" stop-opacity="0"/>
      <stop offset=".54" stop-color="var(--blue)"/>
      <stop offset="1" stop-color="var(--green)" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M1 8H423m34 0H879" stroke="var(--line)"/>
  <path d="m440 3 5 5-5 5-5-5Z" fill="none" stroke="var(--blue)"/>
  <circle cx="440" cy="8" r="1.5" fill="var(--green)"/>
  <rect class="sweep" y="7" width="140" height="2" rx="1" fill="url(#beam)"/>
</svg>
